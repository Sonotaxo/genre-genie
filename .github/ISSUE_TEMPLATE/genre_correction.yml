name: Genre Calibration / Correction
description: Submit a misidentified song or matrix calibration report
title: "[Correction]: "
labels: ["calibration", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping Genre Genie learn! Please provide the details of the track and what the engine guessed.
  - type: input
    id: predicted
    attributes:
      label: Predicted Genre
      description: What did Genre Genie guess?
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual Genre
      description: What is the true genre of the track?
    validations:
      required: true
  - type: input
    id: audio_url
    attributes:
      label: Audio Sample Link
      description: A YouTube, Spotify, SoundCloud, or Bandcamp link to listen to the track.
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: What sounds or hallmarks gave it away?
      description: Describe the acoustic hallmark, BPM, rhythm, instrument, or atmosphere that distinguishes it.
    validations:
      required: false
  - type: textarea
    id: trace
    attributes:
      label: Diagnostic Trace (JSON)
      description: The session diagnostic trace generated by Genre Genie.
      render: json
    validations:
      required: false
