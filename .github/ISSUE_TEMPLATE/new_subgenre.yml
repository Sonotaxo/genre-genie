name: New Sub-Genre Proposal
description: Suggest a missing genre or subgenre (even just a name or track link is welcome!)
title: "[Sub-Genre]: "
labels: ["subgenre-request", "data"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Missing a sound in Genre Genie?
        You don't need to do extensive research to submit a request. **Even just a genre name or a single track/artist link is enough!**
        Our maintainers and AI agents will research the sensory hallmarks, find benchmark tracks, and calibrate the likelihood matrix.

  - type: input
    id: name
    attributes:
      label: Sub-Genre Name
      description: What is the genre or subgenre called?
      placeholder: "e.g. Future Bass, Hardgroove Techno, Lo-Fi Beats, Progressive Trance"
    validations:
      required: true

  - type: input
    id: examples
    attributes:
      label: Example Artists, Tracks, or Audio Links (Optional)
      description: Name an artist, track, or paste a Spotify, YouTube, or SoundCloud link so we can listen to it.
      placeholder: "e.g. Flume, Illenium - Crawl Outta Love, or https://open.spotify.com/..."
    validations:
      required: false

  - type: dropdown
    id: parent_macro
    attributes:
      label: Parent Family / Main Genre (Optional)
      description: Where does this roughly belong? (Feel free to leave as "Not sure")
      options:
        - "Not sure / Leave it to the team"
        - "Techno"
        - "House"
        - "Trance"
        - "Dubstep & Bass"
        - "Drum & Bass"
        - "Ambient / Downtempo"
        - "Synthwave / Outrun"
        - "Hardstyle & Hardcore"
        - "IDM & Experimental"
        - "Rock & Alternative"
        - "Metal & Hard Rock"
        - "Hip Hop & Rap"
        - "R&B, Soul & Funk"
        - "Jazz & Blues"
        - "Latin & Global"
        - "Other / New Family"
    validations:
      required: false

  - type: input
    id: aliases
    attributes:
      label: Aliases or Slang Names (Optional)
      description: Any other names people use for this style?
      placeholder: "e.g. Slow Techno, Ketapop, Melodic Bass"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: How would you describe the sound? (Optional)
      description: Any thoughts on what makes it unique? (BPM/tempo, drum beat, instruments, mood, or what distinguishes it from other genres).
      placeholder: "e.g. Heavy half-time bounce with detuned, soaring supersaw chord drops, pitched vocal chops, and emotive pop-style melodies."
    validations:
      required: false

  - type: input
    id: reference_url
    attributes:
      label: Reference Link (Optional)
      description: RateYourMusic, Wikipedia, or an article/playlist link if you have one handy.
      placeholder: "https://rateyourmusic.com/genre/..."
    validations:
      required: false
